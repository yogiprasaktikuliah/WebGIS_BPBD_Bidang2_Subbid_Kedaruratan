<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
        
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>WebGIS Subbid Kedaruratan - BPBD</title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/Admin_Kalsel_Biro_Tapem_1.js"></script>
        <script src="styles/Admin_Kalsel_Biro_Tapem_1_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        
        
        <script>
          fetch('./data/layer_config.json')
            .then(response => response.json())
            .then(data => {
                if (!data.layers) return;

                // Membaca setiap file yang diupload admin satu per satu
                data.layers.forEach(item => {
                    if (!item.file_peta) return;

                    // Fungsi mengubah kode warna menjadi format Transparan
                    function hexToRgba(hex, alpha) {
                        var r = parseInt(hex.slice(1, 3), 16),
                            g = parseInt(hex.slice(3, 5), 16),
                            b = parseInt(hex.slice(5, 7), 16);
                        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
                    }

                    var warnaSolid = item.warna || '#FF0000';
                    var warnaTransparan = hexToRgba(warnaSolid, item.transparansi || 0.6);

                    // Membuat layer baru sesuai pengaturan admin
                    var layerDinamis = new ol.layer.Vector({
                        title: '<details><summary><b>' + item.nama + '</b></summary>Data Update</details>',
                        source: new ol.source.Vector({
                            format: new ol.format.GeoJSON(),
                            url: '.' + item.file_peta 
                        }),
                        style: new ol.style.Style({
                            // Gaya untuk Polygon (Area)
                            fill: new ol.style.Fill({ color: warnaTransparan }),
                            // Gaya untuk Line (Garis/Sungai)
                            stroke: new ol.style.Stroke({ color: warnaSolid, width: 2 }),
                            // Gaya untuk Point (Titik)
                            image: new ol.style.Circle({
                                radius: 6,
                                fill: new ol.style.Fill({ color: warnaTransparan }),
                                stroke: new ol.style.Stroke({ color: warnaSolid, width: 1.5 })
                            })
                        })
                    });

                    // Memasukkan layer ke peta
                    setTimeout(function() {
                        if (typeof map !== 'undefined') {
                            map.addLayer(layerDinamis);
                        }
                    }, 1500);
                });
            })
            .catch(err => console.log('Sistem siap. Belum ada data layer tambahan dari admin.'));
        </script>
        <script>
          if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
              if (!user) {
                window.netlifyIdentity.on("login", () => {
                  document.location.href = "/admin/";
                });
              }
            });
          }
        </script>
    </body>
</html>
